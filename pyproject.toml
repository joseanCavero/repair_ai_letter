[project]
name = "repair-ai"
version = "0.1.0"
description = "Customer-facing repair description generation service (PoC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repair_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
